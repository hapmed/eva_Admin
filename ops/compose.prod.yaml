# EVAS Admin — Compose para el VPS (producción).
#
# Usa la red externa `apps-net` para alcanzar el contenedor PostgreSQL
# existente (host `postgres`), que NO se gestiona desde aquí (ADR-004).
# No declara ningún servicio PostgreSQL.
#
# Uso (build local):  docker compose -f ops/compose.prod.yaml build
#     (desde GHCR):   docker compose -f ops/compose.prod.yaml pull
#                     docker compose -f ops/compose.prod.yaml up -d
# Evita publicar puertos: se expone vía túnel/proxy (servicio `proxy`).

name: evas-admin

services:
  api:
    image: ghcr.io/hapmed/evas-admin-api:${EVAS_IMAGE_TAG:-latest}
    build:
      context: ../backend
    env_file: [../.env]
    networks: [evas_admin_net, apps-net]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: ghcr.io/hapmed/evas-admin-web:${EVAS_IMAGE_TAG:-latest}
    build:
      context: ../frontend
    env_file: [../.env]
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      API_INTERNAL_URL: "http://api:8000"
    networks: [evas_admin_net]
    depends_on: [api]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  agent:
    image: ghcr.io/hapmed/evas-admin-agent:${EVAS_IMAGE_TAG:-latest}
    build:
      context: ../agent
    env_file: [../.env]
    networks: [evas_admin_net]
    restart: unless-stopped
    # Modo real: SOLO el agente accede a Docker. El socket se monta aquí y en ningún otro servicio.
    # group_add = GID del grupo `docker` del host (ajustar si cambia): acceso al socket sin ser root.
    group_add:
      - "989"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /:/host:ro
      - /opt/apps/backups/evas:/backups
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Modo simulated por defecto. En modo real, montar el socket Docker SÓLO aquí,
    # con permisos mínimos y tras revisión de seguridad (ADR-007).

  # Punto de entrada único: la web y /api/* en el mismo origen.
  # El túnel debe apuntar a http://127.0.0.1:8081 (host) o http://proxy:80 (red apps-net).
  proxy:
    image: caddy:2.8-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:8081:80"
    networks: [evas_admin_net, apps-net]
    depends_on: [api, web]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  evas_admin_net:
    driver: bridge
  apps-net:
    external: true
