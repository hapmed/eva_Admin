# Manifiesto de la EVA (contrato con EVAS Admin). Sin secretos.
# Repositorio de la EVA: https://github.com/hapmed/eva
# Ver docs/EVAS_APPS/REQUISITOS_EVA.md y MANIFEST_EJEMPLO.yaml

code: eva                           # identificador ESTABLE (no cambiar)
name: EVA
description: Aplicación de negocio de HAPMED (personalizable por cliente).
image: ghcr.io/hapmed/eva           # repositorio de la imagen (sin tag)

versions:
  - version: "0.1.0"
    status: approved

port: 8000
healthcheck: /healthz

config_schema:
  properties:
    locale:
      type: string
    cliente:
      type: string
    branding:
      type: string
  required:
    - locale

env:
  - EVAS_EVA_CODE
  - EVAS_INSTALLATION_ID
  - EVAS_CLIENT_REF
  - EVAS_VERSION
  - DATABASE_URL
  - PORT
  - EVA_CLIENT_NAME

secrets:
  - key: DB_PASSWORD
    provider: env

migrate: "alembic upgrade head"

labels:
  evas.managed_by: evas-admin
  evas.eva_code: eva

resources:
  cpu: "0.5"
  memory: "512Mi"
